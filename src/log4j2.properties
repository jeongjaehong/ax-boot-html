status = warn
name = PropertiesConfig

# Global logger settings (no per-class/package overrides)
rootLogger.level = info
rootLogger.appenderRefs = stdout, rolling
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.rolling.ref = ROLLING

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss.SSS}] [%t] %-5level %c - %msg%n

# log4j2.properties 에 임시로 추가
logger.framework.name = framework
logger.framework.level = info
logger.framework.additivity = true

# Rolling file appender (DailyRollingFileAppender equivalent)
property.log4j.app.name = ApplicationName

appender.rolling.type = RollingFile
appender.rolling.name = ROLLING
appender.rolling.fileName = ${sys:catalina.base}/logs/${log4j.app.name}-output.log
appender.rolling.filePattern = ${sys:catalina.base}/logs/${log4j.app.name}-output.log.%d{yyyy-MM-dd}
appender.rolling.append = true
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = [%d{yyyy.MM.dd HH:mm:ss, SSS}] (%F:%L) : %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true
